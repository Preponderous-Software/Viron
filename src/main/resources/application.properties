spring.application.name=viron
server.port=9999

database.dbUrl=jdbc:postgresql://localhost:5432/postgres
database.dbUsername=postgres
database.dbPassword=postgres

# Connections are pooled by HikariCP (see DataSourceConfig). Actuator would otherwise add a
# database contributor to /actuator/health, which is left off so health stays a liveness signal
# that does not go DOWN — and restart pods — during a database outage. Turn on where
# /actuator/health is consumed as a readiness signal instead.
management.health.db.enabled=false

service.vironHost=http://localhost
service.vironPort=9999

# Registers DebugController and its data-seeding endpoints under /api/v1/debug.
# Off by default so debug tooling does not ship to production; turn on for local/dev use.
viron.debug.enabled=${VIRON_DEBUG_ENABLED:false}
# Bearer token attached by the in-repo client SDKs (EnvironmentService, GridService,
# LocationService, EntityService) to every outgoing request; empty means no
# Authorization header is sent. Set to a token issued by the UserAuth service.
service.authToken=${VIRON_CLIENT_AUTH_TOKEN:}

# --- JWT authentication (validates tokens issued by the UserAuth service) ---
# Shared HMAC secret; REQUIRED (no default — the app fails to start without it).
# For HS256 it must be at least 32 bytes. Must match UserAuth's JWT_SECRET.
app.jwt.secret=${JWT_SECRET}
app.jwt.issuer=${JWT_ISSUER:userauth}
app.jwt.algorithm=${JWT_ALGORITHM:HS256}

# --- Usage reporting (trace) ---
# On start-up the service sends ONE "startup" event to the trace usage-tracking service:
# the program name ("viron"), its version, and the tag service=true. Nothing per request,
# and nothing about users, hosts, addresses or data. Sent off the main thread; a server that
# is down or slow is a dropped report, never a failed start-up or a blocked request.
# Set USAGE_REPORTING_ENABLED=false to turn it off.
usage-reporting.enabled=${USAGE_REPORTING_ENABLED:true}
usage-reporting.endpoint=${USAGE_REPORTING_ENDPOINT:https://trace.danielstephenson.dev}
usage-reporting.key=${USAGE_REPORTING_KEY:jmLLSV4-qh-ANK1QbZCUH-8t2JCwb_depi_ZUJP7pgk}
# The version tag; filled in from the Maven project version at build time.
usage-reporting.version=@project.version@
